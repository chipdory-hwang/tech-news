<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT/AI/반도체 주요 뉴스 상세 브리핑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fdfdfd; font-family: 'Pretendard', -apple-system, sans-serif; padding: 40px 0; }
        .header { text-align: center; margin-bottom: 50px; border-bottom: 2px solid #333; padding-bottom: 20px; }
        .table-container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }

        thead { background: #1a1a1a; color: white; }

        .col-media { width: 10%; text-align: center; }
        .col-title { width: 25%; font-weight: bold; color: #0d6efd; }
        .col-desc { width: 60%; line-height: 1.6; text-align: justify; }
        .badge-media { padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; font-weight: bold; }
        .bg-et { background: #e3f2fd; color: #0d47a1; } /* 전자신문 */
        .bg-dt { background: #f1f8e9; color: #33691e; } /* 디지털타임스 */
        .bg-ai { background: #fff3e0; color: #e65100; } /* 인공지능신문 */
        .bg-ny { background: #f5f5f5; color: #212121; } /* NYT */

</head>
<body>

<div class="container-fluid px-5">
    <header class="header">
        <h1 class="display-5 fw-bold">Daily Tech Intelligence Report</h1>
        <p class="lead text-muted">반도체 · AI · IT · 과학 분야 매체별 주요 뉴스 상세 요약 (2026.04.13 - 04.15)</p>
    </header>

    <div class="table-container shadow">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th class="col-no">#</th>
                    <th class="col-media">매체</th>
                    <th class="col-title">제목</th>
                    <th class="col-desc">상세 내용 요약</th>
                </tr>
            </thead>
            <tbody id="news-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const newsData = [
        // 전자신문 (1-3)

        { media: "전자신문", badge: "bg-et", title: "정부, AI 컴퓨팅 인프라 확충에 5000억 투자", desc: "국가 AI 경쟁력 강화를 위해 고성능 컴퓨팅 자원을 현재보다 10배 이상 확충하는 로드맵이 발표되었습니다. 국산 AI 반도체(NPU)를 데이터 센터에 우선 적용하여 외산 의존도를 낮추고, 국내 AI 기업들이 저렴한 비용으로 거대언어모델(LLM)을 학습시킬 수 있는 환경을 조성할 방침입니다." },

        // 디지털타임스 (4-6)

          desc: "한국은행 보고서에 따르면 최근 반도체 경기 회복세는 과거와 달리 AI 서버 수요라는 확실한 실체가 뒷받침되고 있습니다. HBM(고대역폭메모리) 수출 가격이 상승세를 유지하고 있으며, 일반 범용 D램 수요까지 동반 상승하는 국면에 진입하여 내년 상반기까지 견조한 수출 흑자를 기록할 것으로 분석했습니다." },
        { media: "디지털타임스", badge: "bg-dt", title: "네이버 하이퍼클로바X, '보안' 무기로 금융권 영토 확장",

        { media: "디지털타임스", badge: "bg-dt", title: "통신 3사, 'AI 에이전트' 서비스 고도화 경쟁",
          desc: "단순 음성 비서를 넘어 사용자의 맥락을 이해하고 일정을 관리하거나 예약을 대행하는 'AI 에이전트' 경쟁이 치열합니다. 각사는 자사 통신 인프라와 결합하여 통화 내용 요약, 실시간 통역 기능을 강화하고 있으며, 이를 수익화 모델로 연결하기 위한 유료 멤버십 개편을 검토 중입니다." },

        { media: "인공지능신문", badge: "bg-ai", title: "오픈AI, 도쿄에 아시아 첫 본부 설립... 로컬 모델 개발",

        { media: "인공지능신문", badge: "bg-ai", title: "메타, 차세대 AI 가속기 'MTIA' 2세대 버전 투입",
          desc: "메타(구 페이스북)가 자체 개발한 AI 추론 칩 MTIA의 업그레이드 버전을 공개했습니다. 이전 세대 대비 처리 속도를 3배 이상 높였으며, 인스타그램 및 페이스북의 콘텐츠 추천 알고리즘과 광고 최적화 시스템에 우선 적용되어 인프라 비용 효율성을 극대화하고 있습니다." },

        // 뉴욕타임즈 (10-12)
        { media: "NYT", badge: "bg-ny", title: "AI 데이터 센터, 미국 시골 마을의 송전망 풍경을 바꾸다",

        { media: "NYT", badge: "bg-ny", title: "생성형 AI의 그림자: '데이터 중독'과 저작권 소송의 전개",

        { media: "NYT", badge: "bg-ny", title: "AI가 바꾸는 미국 대선 지형... 딥페이크와의 전쟁",
          desc: "2024년 대선을 앞두고 더욱 정교해진 AI 생성 영상과 음성이 유권자들을 혼란에 빠뜨리고 있습니다. 소셜 미디어 플랫폼들은 딥페이크 탐지 기술을 강화하고 'AI 생성물'임을 의무적으로 표기하게 하는 정책을 시행하고 있으나, 기술 발전 속도를 규제가 따라가지 못하는 실정입니다." },

        // IEEE Spectrum (13-15)
        { media: "IEEE", badge: "bg-ie", title: "데이터 센터 열기 식히는 '액체 냉각' 기술의 표준화",
          desc: "AI 칩의 성능 향상에 따른 막대한 발열을 기존의 공랭식(팬)으로는 감당하기 어려워졌습니다. 서버 내부로 냉각수를 직접 흘려보내는 '다이렉트 온 칩(Direct-on-chip)' 냉각 방식이 차세대 표준으로 자리 잡고 있으며, 이를 도입한 데이터 센터의 에너지 효율 지수(PUE)가 1.1 이하로 떨어지는 혁신적 결과가 보고되었습니다." },
        { media: "IEEE", badge: "bg-ie", title: "6G 통신의 비전: '통신'과 '컴퓨팅'의 완전한 결합",
          desc: "단순히 전송 속도를 높이는 것을 넘어, 통신 네트워크 자체가 AI 연산을 수행하는 '네트워크 컴퓨팅' 시대가 열리고 있습니다. 지연 시간을 0.1ms 이하로 줄여 자율주행차와 원격 로봇 수술이 완벽하게 작동하는 환경을 목표로 하며, 2030년 상용화를 위한 글로벌 기술 표준 제정 논의가 한창입니다." },
        { media: "IEEE", badge: "bg-ie", title: "실리콘 반도체의 한계 극복할 '탄소 나노튜브' 소자 연구",
          desc: "실리콘 소재의 물리적 미세화 한계를 극복하기 위해 탄소 나노튜브(CNT)를 활용한 트랜지스터 연구가 성과를 내고 있습니다. 기존 실리콘 대비 속도는 3배 빠르고 전력 소모는 3분의 1 수준인 CNT 칩 프로토타입이 제작되었으며, 이는 저전력 고성능 모바일 칩 시장의 게임 체인저가 될 것으로 주목받고 있습니다." }
    ];

    const tbody = document.getElementById('news-body');
    newsData.forEach((item, index) => {
        const row = `<tr>
            <td class="col-no">${index + 1}</td>
            <td class="col-media text-center"><span class="badge-media ${item.badge}">${item.media}</span></td>
            <td class="col-title">${item.title}</td>
            <td class="col-desc">${item.desc}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
</script>

</body>
</html>
