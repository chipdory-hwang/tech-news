<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Briefing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: sans-serif; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: white; padding: 40px 0; text-align: center; margin-bottom: 30px; }
        .card { border: none; border-radius: 12px; height: 100%; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-5px); }
        .btn-link { text-decoration: none; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Tech News Dashboard</h1>
        <p>반도체 · AI · IT 최근 3일 주요 소식</p>
    </header>

    <div class="container">
        <div class="row g-4" id="news-container">
            </div>
    </div>

    <script>
        const newsData = [
            {
                media: "전자신문",
                title: "차세대 AI 반도체 선점 경쟁 가속",
                link: "https://www.etnews.com/",
                desc: "HBM4 양산 계획 및 국내 기업들의 글로벌 시장 대응 전략 요약."
            },
            {
                media: "디지털타임스",
                title: "IT 서비스 업계, 생성형 AI 도입 본격화",
                link: "http://www.dt.co.kr/",
                desc: "공공 및 금융권의 클라우드 전환과 맞물린 AI 솔루션 보급 현황."
            },
            {
                media: "인공지능신문",
                title: "글로벌 AI 컨퍼런스 주요 발표 내용",
                link: "https://www.aitimes.kr/",
                desc: "새로운 멀티모달 모델들의 성능 지표와 상용화 가능성 분석."
            },
            {
                media: "NY Times",
                title: "Inside the AI Chip Arms Race",
                link: "https://www.nytimes.com/section/technology",
                desc: "빅테크 기업들의 자체 칩 설계 열풍과 공급망 변화 취재."
            },
            {
                media: "IEEE Spectrum",
                title: "Computing's Energy Challenge",
                link: "https://spectrum.ieee.org/",
                desc: "AI 연산에 필요한 전력 소모를 줄이기 위한 하드웨어 혁신 기술들."
            }
        ];

        const container = document.getElementById('news-container');
        newsData.forEach(item => {
            container.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card p-3">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-dark mb-2" style="width: fit-content;">${item.media}</span>
                            <h5 class="card-title fw-bold">${item.title}</h5>
                            <p class="card-text text-muted small">${item.desc}</p>
                            <div class="mt-auto">
                                <a href="${item.link}" target="_blank" class="btn btn-primary btn-link w-100">기사 원문 읽기</a>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
