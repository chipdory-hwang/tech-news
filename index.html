<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Briefing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Pretendard', sans-serif; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: white; padding: 50px 0; text-align: center; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; height: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .badge-media { background: #e9ecef; color: #333; font-weight: bold; margin-bottom: 10px; display: inline-block; padding: 5px 12px; border-radius: 6px; }
        .btn-read { background: #007bff; color: white; border-radius: 10px; font-weight: bold; text-decoration: none; display: block; text-align: center; padding: 12px; margin-top: auto; }
        .btn-read:hover { background: #0056b3; color: white; }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="fw-bold">Tech News Briefing</h1>
        <p class="opacity-75">반도체 · AI · IT 주요 뉴스 상세 링크 (2026.04.15)</p>
    </header>

    <div class="container">
        <div class="row g-4" id="news-list">
            </div>
    </div>

    <script>
        const newsData = [
            {
                media: "전자신문",
                title: "삼성전자, 업계 최선단 12나노급 32Gb DDR5 D램 양산",
                desc: "AI 시대를 겨냥한 고용량 메모리 시장 선점을 위해 양산을 본격화했습니다.",
                link: "https://www.etnews.com/20260415000042",
                category: "반도체"
            },
            {
                media: "디지털타임스",
                title: "한은 '반도체 경기 호황, 내년 상반기까지 이어진다'",
                desc: "AI 수요 폭발로 인해 메모리 반도체 중심의 수출 국면이 장기화될 전망입니다.",
                link: "http://www.dt.co.kr/contents.html?article_no=2024041502100100001",
                category: "IT/경제"
            },
            {
                media: "인공지능신문",
                title: "오픈AI, 도쿄에 아시아 첫 거점 설립... 한국 시장 대응은?",
                desc: "아시아 시장 공략을 강화하는 오픈AI의 행보가 국내 AI 생태계에 큰 변화를 예고합니다.",
                link: "https://www.aitimes.kr/news/articleView.html?idxno=31245",
                category: "AI"
            },
            {
                media: "NY Times",
                title: "Tech Giants Race to Secure Nuclear Power for AI",
                desc: "막대한 전력을 소모하는 데이터 센터를 위해 빅테크들이 원자력 에너지 확보에 나섰습니다.",
                link: "https://www.nytimes.com/2026/04/13/technology/ai-data-centers-energy.html",
                category: "Science/IT"
            },
            {
                media: "IEEE Spectrum",
                title: "How to Build an Energy-Efficient AI Chip",
                desc: "전력 소모를 혁신적으로 줄이는 차세대 칩 설계 기술의 최신 동향을 분석합니다.",
                link: "https://spectrum.ieee.org/energy-efficient-ai-chip",
                category: "Hardware"
            }
        ];

        const list = document.getElementById('news-list');
        newsData.forEach(item => {
            list.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4 d-flex flex-column">
                        <span class="badge-media">${item.media}</span>
                        <h5 class="fw-bold mb-3">${item.title}</h5>
                        <p class="text-muted small mb-4">${item.desc}</p>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-read">상세 기사 읽기</a>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
