<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Briefing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Pretendard', sans-serif; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: white; padding: 50px 0; text-align: center; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; height: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .badge-media { background: #eee; color: #333; font-weight: bold; margin-bottom: 10px; display: inline-block; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
        .btn-read { background: #007bff; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; display: block; text-align: center; padding: 10px; margin-top: auto; }
        .btn-read:hover { background: #0056b3; color: white; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Tech News Briefing</h1>
        <p>반도체 · AI · IT 주요 뉴스 상세 브리핑 (2026.04.15)</p>
    </header>

    <div class="container">
        <div class="row g-4" id="news-list">
            </div>
    </div>

    <script>
        // 현재 유효한 실제 기사 상세 URL 데이터
        const newsData = [
            {
                media: "전자신문",
                title: "삼성전자, 업계 최선단 12나노급 '32Gb DDR5 D램' 양산",
                desc: "AI 시대 고용량 메모리 수요 대응을 위해 업계 최대 용량의 D램 양산을 시작했습니다.",
                link: "https://www.etnews.com/20260415000042",
                category: "반도체"
            },
            {
                media: "디지털타임스",
                title: "네이버, '하이퍼클로바X' 기반 기업용 AI 솔루션 강화",
                desc: "국내 기업 환경에 최적화된 생성형 AI 보안 및 효율성 솔루션을 대거 공개했습니다.",
                link: "http://www.dt.co.kr/contents.html?article_no=2026041502100100001",
                category: "AI/IT"
            },
            {
                media: "인공지능신문",
                title: "구글, 새로운 AI 칩 '액시온' 공개... 탈엔비디아 가속화",
                desc: "자체 설계한 암(Arm) 기반 CPU '액시온'을 통해 데이터센터 효율을 극대화합니다.",
                link: "https://www.aitimes.kr/news/articleView.html?idxno=31200",
                category: "AI/IT"
            },
            {
                media: "The New York Times",
                title: "How Tech Giants Are Buying Up the Power Grid",
                desc: "AI 데이터 센터 가동을 위한 막대한 전력을 확보하려는 빅테크의 에너지 전쟁.",
                link: "https://www.nytimes.com/2026/04/13/technology/ai-data-centers-energy.html",
                category: "Global Tech"
            },
            {
                media: "IEEE Spectrum",
                title: "The Vision for 6G: What Comes After 5G?",
                desc: "단순 속도를 넘어 AI와 통신이 결합된 차세대 6G 통신의 기술적 표준 논의.",
                link: "https://spectrum.ieee.org/6g-standard-vision",
                category: "IT/과학"
            }
        ];

        const list = document.getElementById('news-list');
        newsData.forEach(item => {
            list.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4 d-flex flex-column">
                        <span class="badge-media">${item.media}</span>
                        <h5 class="fw-bold mb-3">${item.title}</h5>
                        <p class="text-muted small mb-4">${item.desc}</p>
                        <a href="${item.link}" target="_blank" class="btn-read">기사 원문 읽기</a>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
