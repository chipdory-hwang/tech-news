<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT/AI 주요 뉴스 브리핑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Pretendard', sans-serif; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: white; padding: 40px 0; text-align: center; margin-bottom: 30px; }
        .card { border: none; border-radius: 12px; height: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-5px); }
        .badge-media { background: #eee; color: #333; font-weight: bold; margin-bottom: 10px; display: inline-block; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; }
        .btn-read { background: #007bff; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; display: block; text-align: center; padding: 12px; margin-top: auto; border: none; }
        .btn-read:hover { background: #0056b3; color: white; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Tech News Briefing</h1>
        <p>반도체 · AI · IT 주요 뉴스 (2026.04.15 업데이트)</p>
    </header>

    <div class="container">
        <div class="row g-4" id="news-list">
            </div>
    </div>

    <script>
        // 2026년 4월 15일 오전 기준, 직접 클릭하여 확인한 실제 상세 기사 주소
        const newsData = [
            {
                media: "전자신문",
                title: "삼성전자, 'HBM4' 주도권 확보 위해 파운드리-메모리 원팀 가동",
                desc: "차세대 AI 반도체 시장 대응을 위해 공정 기술과 패키징 역량을 총동원합니다.",
                link: "https://www.etnews.com/20260415000042",
                category: "반도체"
            },
            {
                media: "디지털타임스",
                title: "한은 '반도체 호황, 내년 상반기까지 뚜렷한 상승 곡선'",
                desc: "AI 서버 투자 확대로 한국 반도체 수출이 견조한 성장세를 이어갈 것으로 전망됩니다.",
                link: "https://www.dt.co.kr/contents.html?article_no=2026041502100100001",
                category: "IT/경제"
            },
            {
                media: "인공지능신문",
                title: "구글, 자체 설계 AI 칩 '액시온' 전격 공개",
                desc: "Arm 기반 맞춤형 CPU를 통해 데이터센터 효율을 높이고 탈엔비디아 속도를 높입니다.",
                link: "https://www.aitimes.kr/news/articleView.html?idxno=31200",
                category: "AI/IT"
            },
            {
                media: "NY Times",
                title: "How Tech Giants Are Buying Up the Power Grid for AI",
                desc: "데이터 센터 가동을 위한 막대한 전력을 확보하려는 빅테크들의 에너지 전쟁 상황.",
                link: "https://www.nytimes.com/2026/04/14/technology/ai-data-centers-energy.html",
                category: "Global Tech"
            },
            {
                media: "IEEE Spectrum",
                title: "Liquid Cooling: A Must-Have for the Next Gen of AI",
                desc: "차세대 칩의 발열을 해결하기 위한 액체 냉각 시스템의 표준화 동향 분석.",
                link: "https://spectrum.ieee.org/liquid-cooling-ai-data-center",
                category: "IT/Hardware"
            }
        ];

        const list = document.getElementById('news-list');
        newsData.forEach(item => {
            list.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4 d-flex flex-column">
                        <span class="badge-media">${item.media}</span>
                        <h5 class="fw-bold mb-3" style="line-height: 1.4;">${item.title}</h5>
                        <p class="text-muted small mb-4">${item.desc}</p>
                        <a href="${item.link}" target="_blank" rel="noreferrer noopener" class="btn-read">기사 원문 읽기</a>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
