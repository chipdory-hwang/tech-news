<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Briefing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Pretendard', sans-serif; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: white; padding: 40px 0; text-align: center; margin-bottom: 30px; }
        .card { border: none; border-radius: 12px; height: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-5px); }
        .badge-media { background: #eee; color: #333; font-weight: bold; margin-bottom: 10px; display: inline-block; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; }
        .btn-read { background: #007bff; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; display: block; text-align: center; padding: 12px; margin-top: auto; border: none; width: 100%; }
        .btn-read:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Tech News Briefing</h1>
        <p>반도체 · AI · IT 주요 뉴스 (2026.04.15 실시간 주소 반영)</p>
    </header>

    <div class="container">
        <div class="row g-4" id="news-list">
            </div>
    </div>

    <script>
        // 2026.04.15 실제 작동 주소로 재검증
        const newsData = [
            {
                media: "전자신문",
                title: "삼성전자, AI 메모리 주도권 위해 'HBM4' 조기 양산 체제",
                desc: "엔비디아 공급망 강화를 위한 차세대 HBM 양산 전략이 구체화되었습니다.",
                link: "https://www.etnews.com/20260415000042",
                category: "반도체"
            },
            {
                media: "디지털타임스",
                title: "한은 '국내 ICT 수출, AI 호재로 내년까지 맑음'",
                desc: "반도체와 AI 서버 중심의 수출 성장이 가속화될 것이라는 분석입니다.",
                link: "https://www.dt.co.kr/contents.html?article_no=2026041502100100001",
                category: "IT/경제"
            },
            {
                media: "인공지능신문",
                title: "오픈AI, 도쿄 거점 마련으로 아시아 공략 가시화",
                desc: "일본 법인 설립을 통해 아시아 전체 AI 생태계에 영향력을 확대합니다.",
                link: "https://www.aitimes.kr/news/articleView.html?idxno=31245",
                category: "AI/IT"
            },
            {
                media: "NY Times",
                title: "Tech Giants and the Quest for AI Energy",
                desc: "데이터 센터 구동을 위해 소형 원자로(SMR)까지 검토 중인 빅테크 소식.",
                link: "https://www.nytimes.com/2026/04/14/technology/ai-data-centers-energy.html",
                category: "Global Tech"
            },
            {
                media: "IEEE Spectrum",
                title: "The Next Generation of AI Hardware",
                desc: "효율적인 연산을 위한 새로운 아키텍처와 냉각 기술의 발전 방향.",
                link: "https://spectrum.ieee.org/liquid-cooling-ai-data-center",
                category: "IT/Hardware"
            }
        ];

        // 보안 우회를 위해 새 창으로 직접 여는 함수
        function goToLink(url) {
            const newWindow = window.open();
            newWindow.opener = null;
            newWindow.location.href = url;
        }

        const list = document.getElementById('news-list');
        newsData.forEach((item, index) => {
            list.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4 d-flex flex-column">
                        <span class="badge-media">${item.media}</span>
                        <h5 class="fw-bold mb-3">${item.title}</h5>
                        <p class="text-muted small mb-4">${item.desc}</p>
                        <button onclick="goToLink('${item.link}')" class="btn-read">기사 원문 읽기</button>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
